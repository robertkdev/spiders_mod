plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
repositories {
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
version = '0.0.1'
group = 'com.horrormods.spiders'

base {
    archivesName = 'spiders'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def minecraft_version = '1.19.2'
def forge_version = '43.2.0'
def mapping_channel = 'official'
def mapping_version = '1.19.2'

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'spiders'
            mods {
                spiders {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'spiders'
            mods {
                spiders {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.19:3.1.40')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test {
    useJUnitPlatform()
}

// Process resources on build
processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

// Ensure that the encoding is set to UTF-8
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}